[project]
name = "ieee-tools"
version = "0.2.0"
description = "IEEE Xplore 论文检索、Cookie 导出与批量下载 CLI"
readme = "README.md"
authors = [
    { name = "Fishskys", email = "1721619420@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
]

[project.scripts]
ieee-tools = "ieee_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
